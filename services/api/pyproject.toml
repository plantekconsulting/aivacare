[project]
name = "aivacare-api"
version = "0.1.0"
description = "AivaCare continuous-care platform API (roadshow prototype)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "anthropic[mcp]>=1.0",
  "mcp>=1.9",
  "langgraph>=0.6",
  "langgraph-checkpoint-postgres>=2.0",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
  "fastembed>=0.5",
  "pyjwt>=2.9",
  "pyyaml>=6.0",
  "pydantic>=2.8",
  "python-multipart>=0.0.9",
  "reportlab>=4.2",
  "fastmcp>=4.1.4",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
